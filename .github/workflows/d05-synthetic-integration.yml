name: D05 Synthetic Integration (Isolated Only)

on:
  pull_request:
    paths:
      - 'lib/d05/**'
      - 'scripts/test-d05*'
      - 'scripts/d05_*'
      - 'tools/d05/**'
      - 'docs/D05_SYNTHETIC_ADAPTER.md'
      - '.github/workflows/d05-synthetic-integration.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d05-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HYDRA_D05_SYNTHETIC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:d05-adapter

  python-gateway-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source before installing Python dependencies
        run: python scripts/d05_unpack_verified.py --dest "${{ runner.temp }}/d05-gateway"
      - run: python -m pip install -r "${{ runner.temp }}/d05-gateway/requirements-dev.txt"
      - name: Real FastAPI TestClient with isolated SQLite and synthetic fixtures
        env:
          PYTHONPATH: ${{ runner.temp }}/d05-gateway
        run: python scripts/test-d05-python-gateway.py

  cross-language-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      HYDRA_D05_SYNTHETIC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python scripts/d05_unpack_verified.py --dest "${{ runner.temp }}/d05-gateway"
      - run: python -m pip install -r "${{ runner.temp }}/d05-gateway/requirements.txt"
      - name: TypeScript client against actual Python HTTP Gateway
        env:
          HYDRA_D05_SOURCE_ROOT: ${{ runner.temp }}/d05-gateway
          HYDRA_D05_PYTHON: python
        run: npm run test:d05-live
